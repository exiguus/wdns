name: Reusable build and test

on:
  workflow_call:
    inputs:
      publish:
        description: "Whether to push built images to registry"
        required: false
        default: false
        type: boolean
      image_tags:
        description: "Newline-separated list of image tags to apply when publishing"
        required: false
        type: string
      go_version:
        description: "Go version to use"
        required: false
        default: "1.26.2"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go_version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/vendor
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Install kdig
        run: |
          sudo apt-get update
          sudo apt-get install -y knot-dnsutils
          kdig --version || true

      - name: Run tests
        run: go test ./... -v

  build-and-scan:
    name: Build image and (optionally) publish
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.publish }}
          tags: ${{ inputs.image_tags }}
          load: ${{ !inputs.publish }}

      - name: Quick e2e checks (run container when not publishing)
        if: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          echo "Starting container..."
          CONTAINER=$(docker run -d --rm -p 8080:8080 ${{ inputs.image_tags }} || true)
          if [ -z "$CONTAINER" ]; then
            echo "Failed to start container from image; skipping e2e"
            exit 1
          fi
          for i in $(seq 1 30); do
            if docker logs "$CONTAINER" 2>&1 | grep -q "Server started on"; then
              echo "server started"
              break
            fi
            sleep 1
          done

          RESPONSE=$(curl -s -X POST http://localhost:8080/query \
            -H 'Content-Type: application/json' \
            -d '{"nameserver":"1.1.1.1","name":"example.com","type":"A"}')
          echo "response: $RESPONSE"
          echo "$RESPONSE" | grep -E -q '"success"[[:space:]]*:[[:space:]]*true' || (echo "e2e failed (udp)"; docker logs "$CONTAINER"; docker stop "$CONTAINER"; exit 1)

          docker stop "$CONTAINER"

      - name: Run Trivy vulnerability scan (via Docker)
        if: ${{ !inputs.publish }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasecurity/trivy:0.44.0 image --format table ${{ inputs.image_tags }} || true
